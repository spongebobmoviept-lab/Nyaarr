services:
  nyaarr:
    build: .
    container_name: nyaarr
    restart: unless-stopped
    ports:
      - "8686:8686"
    env_file:
      - .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8686/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
